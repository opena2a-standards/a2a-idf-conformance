[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "a2a-idf-conformance"
version = "0.1.0"
description = "Conformance suite for the A2A-IDF (Agent-to-Agent Identity Framework) specification: byte-pinned fixtures, two reference verifiers and the cross-implementation parity gate"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["cryptography>=42.0.0"]

[project.urls]
Repository = "https://github.com/opena2a-standards/a2a-idf-conformance"

[project.scripts]
a2a-idf-conformance = "a2a_idf_conformance:main"

[tool.hatch.build.targets.wheel]
packages = ["src/a2a_idf_conformance"]

# The wheel carries the suite itself, so `pipx run` has the pinned fixtures,
# both reference verifiers and the parity gate without a clone. The layout
# under `suite/` mirrors the repository: each verifier reads `schemas/` next
# to its `scripts/` directory, and the gate reads `fixtures/` two levels above
# `scripts/parity/`. The three scripts are named one by one so that a
# `__pycache__/` left by a local test run is not packaged.
[tool.hatch.build.targets.wheel.force-include]
"fixtures" = "a2a_idf_conformance/suite/fixtures"
"schemas" = "a2a_idf_conformance/suite/schemas"
"vectors" = "a2a_idf_conformance/suite/vectors"
"MANIFEST.sha256" = "a2a_idf_conformance/suite/MANIFEST.sha256"
"scripts/verify.mjs" = "a2a_idf_conformance/suite/scripts/verify.mjs"
"scripts/verify.py" = "a2a_idf_conformance/suite/scripts/verify.py"
"scripts/parity/parity.py" = "a2a_idf_conformance/suite/scripts/parity/parity.py"
